<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grid View — Dummy v2</title>
<style>
:root{
  --bg:#f5f3ef;--card:#fff;--text:#111;--text2:#555;--text3:#999;
  --bdr:#e0dcd5;--acc:#8b6f47;--r:14px;--sp:#1db954;
  --player-h:0px; /* atualizado via JS */
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text)}

/* ── HEADER ──────────────────────────────────────────────── */
.site-header{
  position:sticky;top:0;z-index:800;
  background:rgba(245,243,239,.95);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:.6rem;padding:.6rem 1.2rem;
}
.site-title{font-size:.85rem;font-weight:700}
.site-stats{font-size:.65rem;color:var(--text3)}
.hdr-spacer{flex:1}
.ctrl-input{height:34px;padding:0 .75rem;border-radius:20px;
  border:1px solid var(--bdr);background:#fff;font-size:.78rem;
  width:180px;outline:none}
.ctrl-input:focus{border-color:var(--acc)}

/* ── RESULTS BAR ─────────────────────────────────────────── */
.results-bar{
  display:flex;align-items:center;gap:.5rem;
  font-size:.68rem;color:var(--text3);letter-spacing:.06em;
  text-transform:uppercase;padding:.75rem 1.2rem .5rem;
}
.rb-left{flex:1}
.view-toggle{display:flex;gap:2px}
.vt-btn{width:30px;height:28px;border-radius:6px;border:1px solid var(--bdr);
  background:transparent;cursor:pointer;display:flex;align-items:center;
  justify-content:center;color:var(--text3);transition:all .15s}
.vt-btn.active{background:var(--text);border-color:var(--text);color:#fff}

/* ── GRID ────────────────────────────────────────────────── */
#view-grid{
  display:grid;
  /* desktop: cards maiores, mínimo 200px */
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:1rem;padding:0 1.2rem;
  padding-bottom:calc(var(--player-h) + 1.8rem);
}

/* mobile: exatamente 2 colunas */
@media(max-width:560px){
  #view-grid{grid-template-columns:repeat(2,1fr);gap:.65rem;padding:0 .75rem;
    padding-bottom:calc(var(--player-h) + 1.5rem);}
}

.grid-card{
  border-radius:var(--r);overflow:hidden;cursor:pointer;
  box-shadow:0 3px 16px rgba(0,0,0,.13);
  transition:transform .18s,box-shadow .18s;
  /* sem borda, sem fundo branco — a cor vem do card-bg */
}
.grid-card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(0,0,0,.19)}
.grid-card:active{transform:scale(.97)}

/* Sem moldura lateral/superior — capa vai até a borda do card */
.grid-frame{padding:0}
.grid-cover{
  width:100%;aspect-ratio:1/1;object-fit:cover;
  display:block;border-radius:0;
  background:#ddd;
}
.grid-info{
  /* mesmo fundo colorido do frame */
  padding:.45rem .6rem .55rem;
}
.grid-artist{
  font-size:.53rem;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:rgba(0,0,0,.45);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:.18rem;
}
.grid-title{
  font-size:.72rem;font-weight:800;color:rgba(0,0,0,.78);
  line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.grid-year{
  font-size:.62rem;font-weight:400;color:rgba(0,0,0,.4);
  margin-left:.25rem;font-style:italic;
}

/* ── LIST VIEW ───────────────────────────────────────────── */
#view-list{
  display:flex;flex-direction:column;gap:.4rem;
  padding:0 1.2rem;
  padding-bottom:calc(var(--player-h) + 1.8rem);
}
.list-card{
  background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);
  display:flex;align-items:center;gap:.7rem;padding:.5rem .75rem;
  cursor:pointer;transition:background .12s;
}
.list-card:hover{background:#f0ece5}
.list-cover{width:48px;height:48px;object-fit:cover;border-radius:7px;flex-shrink:0;background:#ddd}
.list-info{flex:1;min-width:0}
.list-artist{font-size:.58rem;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.08rem}
.list-title{font-size:.79rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-meta{font-size:.61rem;color:var(--text3);margin-top:.1rem}

/* ── LIGHTBOX — estilo card expandido (dark) ─────────────── */
#lightbox{position:fixed;inset:0;z-index:9000;display:none;align-items:center;justify-content:center;padding:1rem}
#lightbox.open{display:flex}
.lb-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(12px)}
.lb-card{
  position:relative;z-index:1;
  background:#1c1c1c;border-radius:12px;
  width:100%;max-width:700px;max-height:calc(100vh - 80px);
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 28px 80px rgba(0,0,0,.6);color:#e8e8e8;
}
.lb-close{
  position:absolute;top:.6rem;right:.6rem;z-index:10;
  width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.12);color:#ccc;border:none;cursor:pointer;
  font-size:.8rem;display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.lb-close:hover{background:rgba(255,255,255,.25)}

/* Header */
.lb-header{
  position:relative;flex-shrink:0;overflow:hidden;
}
.lb-blur-bg{
  position:absolute;inset:0;background-size:cover;background-position:center;
  filter:blur(40px) saturate(.55);opacity:.38;transform:scale(1.1);
}
.lb-header-inner{
  position:relative;z-index:1;
  display:flex;gap:.85rem;align-items:flex-start;
  padding:.9rem 1rem .85rem;padding-right:9rem; /* espaço para btns */
}
.lb-cover{width:90px;height:90px;object-fit:cover;border-radius:6px;flex-shrink:0;background:#333}
.lb-meta{flex:1;min-width:0}
.lb-artist{font-size:.95rem;font-weight:700;color:#e8e8e8;margin-bottom:.1rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-title{font-size:1.1rem;font-weight:800;color:#fff;line-height:1.22;margin-bottom:.3rem}
.lb-meta-row{font-size:.63rem;color:rgba(255,255,255,.42);margin-bottom:.25rem;line-height:1.5}
.lb-stats{font-size:.62rem;color:rgba(255,255,255,.38);margin-top:.22rem}
/* Botões no canto superior direito do header */
.lb-btn-col{
  position:absolute;top:.9rem;right:.85rem;z-index:2;
  display:flex;flex-direction:column;gap:.28rem;
}
.lb-btn{font-size:.66rem;font-weight:600;padding:.28rem .6rem;border-radius:6px;
  border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);
  color:#e0e0e0;cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;gap:.3rem;
  transition:all .12s;white-space:nowrap}
.lb-btn:hover{background:rgba(255,255,255,.22);color:#fff}

/* Body / track list */
.lb-divider{height:1px;background:rgba(255,255,255,.07);flex-shrink:0}
.lb-body{overflow-y:auto;flex:1;padding:.3rem 0 .6rem}
.lb-tracks-title{font-size:.57rem;font-weight:700;color:rgba(255,255,255,.3);
  text-transform:uppercase;letter-spacing:.08em;padding:.5rem 1rem .3rem}
.lb-track{
  display:flex;align-items:center;gap:.5rem;
  padding:.3rem 1rem;border-bottom:1px solid rgba(255,255,255,.05);
  font-size:.73rem;transition:background .1s;cursor:default;
}
.lb-track:last-child{border-bottom:none}
.lb-track:hover{background:rgba(255,255,255,.04)}
.lb-track-pos{width:24px;flex-shrink:0;font-size:.6rem;color:rgba(255,255,255,.28);font-weight:600;text-align:right}
.lb-track-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.18);flex-shrink:0}
.lb-track-info{flex:1;min-width:0}
.lb-track-title{color:#e8e8e8;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-track-artist{font-size:.6rem;color:rgba(255,255,255,.38);margin-top:.03rem}
.lb-track-bpm{font-size:.62rem;font-weight:700;color:rgba(255,255,255,.7);
  background:rgba(255,255,255,.1);border-radius:5px;padding:.06rem .32rem;
  flex-shrink:0;letter-spacing:.02em}
.lb-track-btns{display:flex;gap:.22rem;flex-shrink:0}
.lb-trk-btn{font-size:.6rem;font-weight:600;padding:.18rem .42rem;border-radius:4px;
  border:none;cursor:pointer;text-decoration:none;
  display:inline-flex;align-items:center;gap:.2rem;transition:all .12s}
.lb-trk-btn-sp{background:#1db954;color:#fff}
.lb-trk-btn-sp:hover{background:#1aa348}
.lb-trk-btn-ouv{background:rgba(255,255,255,.1);color:#e0e0e0;border:1px solid rgba(255,255,255,.18)}
.lb-trk-btn-ouv:hover{background:rgba(255,255,255,.2)}

/* ── SPOTIFY PLAYER — flutuante nativo ───────────────────── */
#sp-wrap{
  position:fixed;
  bottom:.6rem;left:50%;transform:translateX(-50%);
  width:min(400px,calc(100vw - 2rem));
  z-index:9500;
  transition:bottom .3s ease;
}
#sp-wrap.hidden{bottom:-110px}

.sp-card{
  border-radius:14px;
  border:1px solid rgba(0,0,0,.1);
  box-shadow:0 8px 32px rgba(0,0,0,.2);
  overflow:hidden;
  position:relative;
}
.sp-card iframe{
  width:100%;height:80px;border:none;display:block;
}
/* Botão collapse — pequeno, acima do canto direito do card */
.sp-collapse-btn{
  position:absolute;top:-11px;right:6px;
  width:22px;height:22px;border-radius:50%;
  background:rgba(255,255,255,.95);border:1px solid rgba(0,0,0,.1);
  box-shadow:0 2px 6px rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:.58rem;color:var(--text3);transition:color .15s;
}
.sp-collapse-btn:hover{color:var(--sp)}
#sp-wrap.hidden .sp-collapse-btn svg{transform:scaleY(-1)}
.sp-collapse-btn svg{transition:transform .3s}

@media(max-width:480px){
  .lb-card{max-height:92vh}
  .lb-cover{width:72px;height:72px}
  .lb-title{font-size:.9rem}
  .ctrl-input{width:130px}
}
</style>
</head>

var allAlbums = ALBUMS.slice();

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// ── GRID RENDER ───────────────────────────────────────────────────────────
function renderGrid(albums){
  var g = document.getElementById('view-grid');
  g.innerHTML = albums.map(function(a, i){
    var bg = PASTELS[i % PASTELS.length];
    var titleYearHtml = esc(a.title)
      + (a.year && a.year!=='0'
        ? '<span class="grid-year"> · '+esc(a.year)+'</span>' : '');
    return '<div class="grid-card" onclick="openLightbox(\''+esc(a.id)+'\')" style="--card-bg:'+bg+'">'
         + '<div class="grid-frame" style="background:'+bg+'">'
         + '<img class="grid-cover" src="'+esc(a.cover)+'" alt="" loading="lazy">'
         + '</div>'
         + '<div class="grid-info" style="background:'+bg+'">'
         + '<div class="grid-artist">'+esc(a.artist)+'</div>'
         + '<div class="grid-title">'+titleYearHtml+'</div>'
         + '</div>'
         + '</div>';
  }).join('');
}

// ── LIST RENDER ───────────────────────────────────────────────────────────
function renderList(albums){
  var l = document.getElementById('view-list');
  l.innerHTML = albums.map(function(a){
    var nBpm = a.tracks.filter(function(t){return t.bpm;}).length;
    return '<div class="list-card" onclick="openLightbox(\''+esc(a.id)+'\')">'
         + '<img class="list-cover" src="'+esc(a.cover)+'" alt="" loading="lazy">'
         + '<div class="list-info">'
         + '<div class="list-artist">'+esc(a.artist)+'</div>'
         + '<div class="list-title">'+esc(a.title)+(a.year&&a.year!=='0'?' · '+esc(a.year):'')+'</div>'
         + '<div class="list-meta">'+a.tracks.length+' faixas'+(nBpm?' · '+nBpm+' com BPM':'')+'</div>'
         + '</div></div>';
  }).join('');
}

function setView(v){
  document.getElementById('view-grid').style.display = v==='grid'?'grid':'none';
  document.getElementById('view-list').style.display = v==='list'?'flex':'none';
  document.getElementById('btn-grid').classList.toggle('active',v==='grid');
  document.getElementById('btn-list').classList.toggle('active',v==='list');
}

function filterCards(q){
  var s = q.toLowerCase().trim();
  var filtered = s ? allAlbums.filter(function(a){
    return (a.artist+' '+a.title+' '+a.year+' '
           +a.tracks.map(function(t){return t.title+' '+t.artist}).join(' '))
           .toLowerCase().includes(s);
  }) : allAlbums;
  document.getElementById('cnt').textContent = filtered.length;
  renderGrid(filtered);
  renderList(filtered);
}

// ── LIGHTBOX ──────────────────────────────────────────────────────────────
var SVG_DISC = '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="opacity:.8"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4" fill="#1c1c1c"/></svg>';
var SVG_SP   = '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="color:#1db954"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>';

function openLightbox(id){
  var idx = allAlbums.findIndex(function(x){return x.id===id;});
  if(idx<0) return;
  var a = allAlbums[idx];

  var discUrl = 'https://www.discogs.com/release/'+esc(a.id);
  var spUrl   = 'https://open.spotify.com/playlist/05ler2wgODLDCUTzCTyoip';

  // BPM range (from tracks)
  var bpmVals = a.tracks.filter(function(t){return t.bpm;}).map(function(t){return parseInt(t.bpm);});
  var bpmRangeStr = bpmVals.length
    ? (Math.min.apply(null,bpmVals)===Math.max.apply(null,bpmVals)
        ? bpmVals[0]+' BPM'
        : Math.min.apply(null,bpmVals)+'–'+Math.max.apply(null,bpmVals)+' BPM')
    : '';
  var nBpm = bpmVals.length;

  // Header: cover-blur background + content
  var hdr = document.getElementById('lb-header');
  hdr.innerHTML =
    '<div class="lb-blur-bg" style="background-image:url(\''+esc(a.cover)+'\')"></div>'
    +'<div class="lb-header-inner">'
    +'<img class="lb-cover" src="'+esc(a.cover)+'" alt="" loading="lazy">'
    +'<div class="lb-meta">'
    +'<div class="lb-artist">'+esc(a.artist)+'</div>'
    +'<div class="lb-title">'+esc(a.title)+'</div>'
    +(a.year&&a.year!=='0'?'<div class="lb-meta-row">'+esc(a.year)+(bpmRangeStr?' &middot; '+bpmRangeStr:'')+'</div>':'')
    +'<div class="lb-stats">'+a.tracks.length+' faixas'+(nBpm?' &middot; '+nBpm+' com BPM':'')+'</div>'
    +'</div>'
    +'</div>'
    +'<div class="lb-btn-col">'
    +'<a class="lb-btn" href="'+discUrl+'" target="_blank" onclick="event.stopPropagation()">'+SVG_DISC+' Discogs</a>'
    +'<a class="lb-btn" href="'+spUrl+'" target="_blank" onclick="event.stopPropagation()">'+SVG_SP+' Spotify</a>'
    +'</div>';

  // Track list
  document.getElementById('lb-body').innerHTML =
    '<div class="lb-tracks-title">'+a.tracks.length+' Faixas</div>'
    + a.tracks.map(function(t){
        return '<div class="lb-track">'
          +'<span class="lb-track-pos">'+esc(t.pos)+'</span>'
          +'<div class="lb-track-dot"></div>'
          +'<div class="lb-track-info">'
          +'<div class="lb-track-title">'+esc(t.title)+'</div>'
          +(t.artist!==a.artist?'<div class="lb-track-artist">'+esc(t.artist)+'</div>':'')
          +'</div>'
          +(t.bpm?'<span class="lb-track-bpm">'+esc(t.bpm)+'</span>':'')
          +'<div class="lb-track-btns">'
          +'<a class="lb-trk-btn lb-trk-btn-sp" href="'+spUrl+'" target="_blank" onclick="event.stopPropagation()">'+SVG_SP+' Spotify</a>'
          +'<span class="lb-trk-btn lb-trk-btn-ouv">&#9654; Ouvir</span>'
          +'</div>'
          +'</div>';
      }).join('');

  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLightbox()});

var spHidden = false;
function togglePlayer(){
  spHidden = !spHidden;
  document.getElementById('sp-wrap').classList.toggle('hidden', spHidden);
}

// ── PADDING DINÂMICO para o último card não ficar atrás do player ─────────
function updatePlayerPadding(){
  var wrap = document.getElementById('sp-wrap');
  var h = wrap.offsetHeight;
  document.documentElement.style.setProperty('--player-h', h+'px');
}
window.addEventListener('resize', updatePlayerPadding);
setTimeout(updatePlayerPadding, 300);

// ── INIT ──────────────────────────────────────────────────────────────────
renderGrid(allAlbums);
renderList(allAlbums);
</script>
